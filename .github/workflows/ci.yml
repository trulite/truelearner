name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run retained-physics tests
        run: cargo test -p frozen-organism-v1-physics

      - name: Run historical archive tests
        run: cargo test -p organism-v0 --lib --bin organism-v0 --test reviewer_api

      - name: Run retained-physics Clippy
        run: cargo clippy -p frozen-organism-v1-physics --all-targets -- -D warnings

      - name: Run historical archive Clippy
        run: cargo clippy -p organism-v0 --all-targets -- -D warnings
