name: Research review
description: Challenge an experimental claim, control, baseline, or supplied prior.
title: "review: "
labels:
  - research-review
body:
  - type: dropdown
    id: area
    attributes:
      label: Review area
      options:
        - Experimental leakage
        - Baseline fairness
        - Missing negative control
        - Supplied representation
        - Statistical validity
        - Rust implementation
        - Reproducibility
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: Claim being reviewed
      description: State the narrow claim and experiment version.
    validations:
      required: true

  - type: textarea
    id: finding
    attributes:
      label: Finding
      description: Describe the failure, weakness, or uncertainty.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction or proposed test
      description: Include seeds, topology, observations, commands, or code.
      render: shell

  - type: textarea
    id: impact
    attributes:
      label: Impact on conclusions
      description: Explain which conclusions should change if the finding is correct.
    validations:
      required: true
