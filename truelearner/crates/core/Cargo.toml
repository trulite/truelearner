[package]
name = "truelearner-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Production physical organism runtime"

[lib]
path = "src/lib.rs"

[features]
cpc1 = []
pqlc0 = ["cpc1"]
pd1 = ["pqlc0"]
ce0 = ["pd1"]
ce1 = ["ce0"]
rs0 = ["pd1"]
sv0 = ["pd1"]
cl0 = ["pd1"]
cc0 = ["cl0"]
cv0 = ["cc0"]
j0 = ["cl0"]
cv0j0 = ["j0"]
si0 = []
core0 = ["ce1", "cv0j0", "rs0", "si0"]
core1 = ["core0"]

[[bin]]
name = "truelearner"
path = "src/main.rs"

[dependencies]
truelearner-arena-format = { path = "../arena-format" }
