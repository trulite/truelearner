[[claim]]
id = "DEVELOPMENTAL-HAND-LADDER"
statement = "An organism can develop an anonymous articulated hand by closing progressively harder physical control loops, while each failed rung exposes the earliest missing transition and admits only previously justified mechanisms that specifically predict that break."
status = "preregistered"
depends_on = ["ANONYMOUS-SERIAL-ARTICULATION"]
falsifiers = [
  "The first anonymous reflected joint cannot reach and leave both limits under the complete recursive candidate.",
  "A later finger, opposing-digit, or hand rung advances after an earlier physical prerequisite fails.",
  "A solve is selected because it improves the benchmark rather than because it predicts the localized first physical divergence.",
  "Development requires semantic joint, digit, hand, direction, target, score, curriculum stage, or evaluator-selected action identity inside the learner.",
  "A successful rung loses reflection, perturbation recovery, exact replay, natural quiescence, inherited controls, or bounded local work.",
  "A mechanism is called necessary before a complete survivor is frozen and rerun through downward ablation.",
]
limitations = [
  "The active preregistered campaigns test only one anonymous reflected joint; they do not yet establish a finger or hand.",
  "The old monolithic candidate moved in both directions on twelve of sixteen steps but reached neither limit, so movement itself is not the current frontier.",
  "An implementation preflight found that replacing synthetic per-step origin tags with truthful anonymous physical origins changed the trajectory before recursive ownership could be interpreted; the original bundled campaign therefore remains unexecuted and a successor factorial decomposition is required.",
  "Recursive construction and owner-local proprioceptive consequence are discovery candidates, not adopted organism authority.",
  "The hand world may expose anonymous physical incidence, motor effect, reflection, and contact, but may not encode anatomy, desired pose, correct movement, or a staged training answer for the learner.",
  "Mechanism selection occurs only after convergence records the first broken transition; no arm may be repaired or adaptively retargeted inside a frozen run.",
  "Consequence-born temporal selectivity now survives strict delayed, coactive, equality, duplicate, disconnected, stale, simultaneous-surface, replay, and quiescence controls, but remains candidate physics rather than adopted authority.",
  "Stable physical boundary-member novelty now rejects twelve exact owned repetitions, preserves two local siblings in both orders and adjacent child expansion, and retains inherited locality, but remains candidate physics because it did not improve the unchanged hand.",
  "Exhaustive post-stall diagnostics found surviving complete and consequential surface paths plus strong motor candidates; the first failure is ownership ambiguity before executability, not path lifetime or traversal.",
  "Strict owner-local factorization transferred in an unrelated two-owner fixture but did not improve the hand because each stalled motor candidate contained two carried origins and only one known owner.",
  "Joint origin/path provenance localized the raw causal-origin runaway to a six-edge unowned cycle that alternated both motor effects across the organism boundary 42 times before exhaustion; the matched boundary reference had no repeated cycle.",
  "Causal boundary-effect terminality preserved outward effect delivery plus external and same-region path formation, removed both hand exhaustions, retained exact replay and natural quiescence, and reached the upper physical boundary; blanket regional closure was rejected as unnecessarily broad.",
  "The repaired hand still expresses only one direction, remains clamped at the upper boundary, fails primary closure, and does not unlock perturbation; the active frontier is now the first opposite-motor failure at upper contact, not another re-entry rule.",
  "The upper-boundary diagnostic found both motor paths live and executable; local competition rejected the silent motor because pre-opening repeated surfaces were admitted as consequence and refreshed the incumbent every clamped step. The active frontier is truthful consequence admission before no-consequence release.",
  "Strict consequence-born return admission preserved valid later returns and rejected nine pre-opening hand returns, but later unchanged resampling remained temporally valid and continued to renew the incumbent. The active frontier is now a benchmark-blind physical distinction between state change and resampling.",
  "Anonymous physical transition lineage distinguished real movement return from unchanged resampling, rejected seventy-six false samples, and preserved replay, quiescence, and truthful travel, but did not release the hand. Once false reinforcement stopped, the silent motor retained path inputs with zero projected drive and never became executable. The active frontier is bounded fresh-alternative opportunity before cancellation and executability, not another consequence or ranking rule.",
  "Completed-cycle composition preserved one uniquely recent accepted-transition successor across changed ownership views nine times, increased official batched movement from eleven to twelve, and retained exact parents, replay, quiescence, and zero propagation exhaustion. It nevertheless reached neither reflected limit, so the active frontier is the first change in the continued physical motor arrow and whether causal cycle identity is natural across learner reconstruction, not another recency window or semantic direction memory.",
  "Group-level admission evidence showed all twenty-three completed-cycle hand choices were functional single-target arrows. The first non-commuting ownership change occurred at step three and tick twenty-three, where organism target eleven became learner-two target ten under FreshAlternative because completed-cycle evidence was Missing; two other ownership changes preserved their target. The active frontier is whether the same participating physical consequence survives construction but becomes owner-invisible, while child private memory must remain fresh.",
  "Lossless retention preserved 2,032 existing events and the exact completed-cycle hand, but the frozen construction-boundary classifier was falsified because it required the consequence junction to equal the later motor target. The immutable slice instead records tick-eight consequence links thirty-five and thirty-six at internal junction eighteen and later downstream participation toward target eleven. The active frontier is a pure compositional fold over this existing artifact; no organism rerun, new trace event, or handoff law is yet justified.",
  "The immutable compositional fold proved OwnerProjectionGap: consequence-bearing link thirty-six retained generation one, was never deallocated, and completed target eleven through tick twenty-three under learner-two ownership, while learner two had no matching private consequence write and read no consequence for target eleven. The active frontier is the smallest physically gated construction-boundary adoption law that makes this one square commute without copying parent memory or exposing unrelated global history.",
  "Same-tick exact-lineage construction composition made the localized square commute without new state: learner two received tick sixteen and target eleven changed from Missing to Stale at tick twenty-three while target ten and the external hand trajectory stayed unchanged. The frozen complete candidate was nevertheless negative because completed-cycle admissions increased from nine to ten, and the reduced artifact did not retain the ordered identity of the extra admission. The active frontier is lossless localization of that first downstream admission change using existing events, not longer recency, held paths, selection changes, or new memory.",
  "The successor retained all ordered choices and localized the extra admission to ordinal seven, hand step six, tick forty-seven after learner-three construction at tick forty-four. It changed the arrow from parent target eleven Missing under Ordinary to candidate target ten Unique under CompletedCycle and led to twenty-four candidate choices. The exact completing link among thirty-three, thirty-four, and forty-one remains unresolved because physical trace retention was conditional on successful identity alignment. The active frontier is unconditional retention followed by tick-and-phase composition into target ten, with no learner-physics change.",
  "Unconditional retention preserved all 2,109 existing witness events and proved that learner-three link thirty-four generation three carries the tick-forty-four construction consequence into the target-ten completed-cycle arrow at tick forty-seven. Links thirty-three and forty-one did not satisfy the admitted arrow's same-generation lineage intersection. The tenth admission is therefore a real recurrence of construction naturality rather than unrelated leakage. The active frontier is a frozen complete-contract successor that accepts ten admissions and twenty-four choices only when every changed admission has an exact composed witness and all prior selectivity controls survive; no law is adopted yet.",
  "The complete construction-naturality contract survived: exactly three construction-born completed cycles factored through live projected generations—link thirty-four generation three at tick forty-seven, link forty-six generation seven at tick ninety-five, and link thirty-four generation three at tick one-hundred-three—even when the last candidate lost final output to coherent-effect priority. The revised candidate has ten admissions and twenty-four choices with unchanged external trajectory, replay, quiescence, zero exhaustion, and all declared selectivity controls. The opt-in law is cleanly integrated for continued hand research but not promoted to accepted default authority. The first remaining hand break is now the plus-three pre-boundary reversal at tick twenty-three, where an exact transported target-eleven witness is Stale before its first matching post-construction competition; the next solve tests bounded first-use eligibility, not global recency extension.",
  "Bounded first-use construction continuation repaired that exact first break: learner-two link thirty-six generation one carried tick sixteen into a Unique target-eleven choice at tick twenty-three, moved the hand from plus three to plus four, reached and escaped upper contact, and was consumed with no duplicate or stale reuse. The complete campaign remained negative because comparisons increased from 5,370 to 7,320 beyond its frozen bound, although scans, replay, quiescence, exhaustion, and the exact parent survived. The active frontier is now parent-versus-candidate per-step comparison localization across the shared prefix; the law remains opt-in and neither lower-side behavior work nor integration may advance first.",
  "Signed per-step localization showed an exact zero-delta prefix through step two and a cheaper repaired step three: minus one comparison and minus eleven scans on identical live topology. All positive excess came after the external trajectories diverged: downstream plus 1,951 comparisons composed with repair minus one to yield the frozen net plus 1,950. The frozen exact-match arms remain negative because they classified any difference as overhead, but the bounded read and consume is not the positive cost source. The active frontier is structured core-work and physical-trace attribution of the step-four plus-517 and step-eleven plus-834 downstream spikes; lower-side behavior and integration remain blocked.",
  "Complete phase attribution classified the downstream comparison increase as finite physical activity rather than waste or runaway. All four major spikes followed upper-boundary inputs with more drive and structural work; step eleven also constructed two learners. The complete plus 1,951 downstream comparisons partition exactly into plus 1,274 minimum-causal-key searches and plus 677 equal-time bucket selections, while both runs remain exactly replayable naturally quiet and unexhausted. The active frontier is one activity-normalized timing-wheel scaling contract bundled with immediate hand-ladder resumption if it passes, or one scheduler-local batching solve if it fails; the old absolute cost verdict remains negative and default authority is unchanged.",
  "Development evidence now closes the first anonymous reflected joint under the unchanged official batched adapter. Stable whole-wave extraction scales linearly; the exact opt-in parent remains unchanged; the return-bearing candidate reaches and leaves both limits, recovers from perturbation, replays exactly, quiesces naturally, and exhausts no propagation budget. Because the worktree lacked a clean named pre-frontier checkpoint, this is not frozen authority and the accepted default remains unchanged. After an authorized clean integration gate, the next hand rung is serial composition in one anonymous two-joint finger.",
  "Development evidence now composes the complete anonymous joint through two and then conditionally five serial components in one shared harness. Immediate-origin and completed-path-origin partitions were falsified by the exact one-joint control; factoring both output choice and fresh opportunity over existing connected physical outcome-source components preserved one-joint behavior and closed every two- and five-joint component under registration, perturbation, replay, quiescence, exhaustion, and activity-bounded work controls. This remains opt-in development evidence from a dirty worktree, not accepted-default or frozen authority. The next research action is clean integration plus downward ablation before a new hand morphology.",
  "Downward ablation now establishes separate necessity inside the declared serial-articulation world. Removing connected-component output choice preserved exact one-module identity but restored proximal suppression at two-joint step zero; removing connected-component opportunity allocation preserved one-module identity and initial motion but restored the distal step-five reversal failure. Both stopped five, while the unchanged complete product again closed two and five with inherited controls. The next action is one clean frozen authority run of that unchanged complete survivor; no new morphology may begin first.",
  "Connected Outcome Product V1 is now authoritative for the next hand ladder. One valid fresh batch at clean commit 7be8bbc3009fe3131622a6ee21e9aa260d649aa1 reproduced the generic topology fixture, exact one-module identity, complete two- and five-joint closure, both distinct removal walls, both origin controls, registration, perturbation, replay, natural quiescence, zero exhaustion, and bounded work. This promotes only the connected-component output-and-opportunity law and bounded anonymous serial-articulation claim; the next morphology remains untested.",
]
