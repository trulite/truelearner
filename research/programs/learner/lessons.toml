[[lesson]]
id = "LP-036"
kind = "learner-physics"
statement = "Selection cannot preserve a cooperating member that never first obtained an executable consequential path."
evidence = ["sensorimotor-participation-continuity-v1:coalition-lineage-localization"]
applies_when = ["coalition learning", "origin sparsity", "missing member"]
research_action = "Establish per-member participation and consequence lineage before testing shared-origin coalition recall."

[[lesson]]
id = "LP-037"
kind = "learner-physics"
statement = "Bounding active aging does not bound structural path formation; execution and structural locality require separate physical frontiers."
evidence = ["sensorimotor-participation-continuity-v1:one-joint-recomposition"]
applies_when = ["topology growth", "path formation cost", "large body", "foveation"]
research_action = "Measure source-local structural proposals and scans independently from active aging before rerunning embodied loops."

[[lesson]]
id = "LP-038"
kind = "learner-physics"
statement = "Repeated survival of local sensorimotor laws alongside failure of their monolithic composition warrants testing causally discovered learner boundaries before adding another global controller rule."
evidence = ["sensorimotor-dependency-sweep-v1:one-joint-composition", "sensorimotor-participation-continuity-v1:one-joint-recomposition", "sensorimotor-synthesis-ladder-v1:one-joint-control"]
applies_when = ["isolated local survival", "monolithic composition failure", "recursive learner construction"]
research_action = "Compare recursively constructed learners with the matched monolithic candidate under anonymous, reflected, noncausal, nested, sibling, and multiple-surface controls."

[[lesson]]
id = "LP-039"
kind = "learner-physics"
statement = "Consequence-born closure requires three local orderings together: incidence after return opening, answer lifetime shared by one output cohort, and eligible returns before ineligible competitors in the same moment."
evidence = ["hand-consequence-born-closure-eligibility-v1:eligible-return-composition", "hand-consequence-born-closure-eligibility-v1:temporal-only-counterexample", "hand-consequence-born-closure-eligibility-v1:temporal-cohort-counterexample"]
applies_when = ["causal closure", "delayed consequence", "same-moment return competition", "recursive learner construction"]
research_action = "Carry physical incidence birth and exact return opening locally, retire answered sibling returns as a cohort after the moment, and preserve stable eligible-first evaluation without multiplying effects."

[[lesson]]
id = "LP-040"
kind = "learner-physics"
statement = "Correct temporal closure does not imply physical boundary novelty; repeated evidence for one already owned surface/output boundary can still create false recursive depth and suppress a distinct sibling surface."
evidence = ["hand-consequence-born-closure-eligibility-v1:boundary-novelty-after-temporal-gate"]
applies_when = ["recursive learner construction", "boundary ownership", "nested depth", "sibling discovery"]
research_action = "Require a new causally participating physical boundary member outside the proposed parent's owned boundary, then test exact repetition, adjacent recursion, and sibling order independently before resuming embodiment."

[[lesson]]
id = "LP-041"
kind = "learner-physics"
statement = "Physical boundary novelty is stable junction membership, not learner depth or regenerated temporary link identity; an owned child proposal must add a participating junction outside its parent's boundary."
evidence = ["hand-physical-boundary-member-novelty-v1:exact-boundary-repetition", "hand-physical-boundary-member-novelty-v1:sibling-breadth-and-locality", "hand-physical-boundary-member-novelty-v1:adjacent-expansion-transfer"]
applies_when = ["recursive construction", "boundary ownership", "sibling breadth", "temporary topology"]
research_action = "Compute stable proposed junction membership before closure evidence, reject owned subsets, and retain root, local sibling, adjacent expansion, locality, replay, and quiescence controls."

[[lesson]]
id = "LP-042"
kind = "learner-physics"
statement = "Removing false boundary depth does not restore autonomous embodied reuse when a real surface consequence writes owner memory but the next surface activity produces neither an owner read nor a motor output."
evidence = ["hand-physical-boundary-member-novelty-v1:conditional-reflected-hand", "hand-physical-boundary-member-novelty-v1:hand-transition-localization"]
applies_when = ["embodied stall", "reverse surface execution", "owner-local consequence", "autonomous reuse"]
research_action = "At the first post-stall surface incidence, order reverse-path lifetime and traversal, motor-candidate formation, owner resolution, and private consequence read before choosing a solve."

[[lesson]]
id = "LP-043"
kind = "learner-physics"
statement = "A post-construction reuse stall can occur after complete and consequential surface paths survive and strong motor candidates form; exhaustive candidate observation localized this hand failure to ownership resolution before executability, not path lifetime or traversal."
evidence = ["hand-autonomous-reuse-localization-v1:boundary-candidate-localization", "hand-autonomous-reuse-localization-v1:temporal-matched-control", "hand-autonomous-reuse-localization-v1:complete-localization"]
applies_when = ["autonomous reuse", "path lifetime", "motor candidate", "ownership ambiguity"]
research_action = "Observe every candidate, including single and rejected candidates, and compare path presence, carried origins, owners, drive, threshold, and executability in one pass before changing memory or lifetime."

[[lesson]]
id = "LP-044"
kind = "learner-physics"
statement = "Strict owner-local factorization can preserve one private effect in an unrelated two-owner fixture yet remain irrelevant to a hand candidate containing two carried origins but only one known learner owner."
evidence = ["hand-owner-local-candidate-factorization-v1:unrelated-mixed-owner-transfer", "hand-owner-local-candidate-factorization-v1:unowned-origin-discriminator", "hand-owner-local-candidate-factorization-v1:conditional-reflected-hand"]
applies_when = ["mixed output incidence", "private owner", "unowned origin", "transfer"]
research_action = "Count carried origins and actual known owners separately; do not infer a cross-owner conflict from ambiguous candidate ownership or promote a fixture-only transfer."

[[lesson]]
id = "LP-045"
kind = "learner-physics"
statement = "Carried physical origin alone is not a safe ownership boundary: a shared unowned label can combine two private paths, while origin-first selection can increase hand movement by creating a self-sustaining wave that fails natural quiescence."
evidence = ["hand-causal-origin-ownership-factorization-v1:same-origin-mixed-owner-control", "hand-causal-origin-ownership-factorization-v1:bounded-reflected-hand", "hand-causal-origin-ownership-factorization-v1:unrelated-origin-transfer"]
applies_when = ["causal-origin factorization", "private ownership", "feedback", "natural quiescence", "embodied movement"]
research_action = "Trace carried origin and actual path owner together, then localize the first repeated feedback cycle before testing another solve; never count bounded termination or extra movement as capability."

[[lesson]]
id = "LP-046"
kind = "learner-physics"
statement = "A non-quiescent embodied wave can be localized as a finite repeated physical graph when every drive firing records both carried-origin ownership and actual path ownership; the hand runaway was a six-edge unowned cycle alternating two motor effects across the organism boundary."
evidence = ["hand-origin-feedback-cycle-localization-v1:origin-path-provenance-disagreement", "hand-origin-feedback-cycle-localization-v1:step-eight-feedback-cycle", "hand-origin-feedback-cycle-localization-v1:matched-boundary-control"]
applies_when = ["non-quiescence", "feedback cycle", "origin provenance", "path ownership", "boundary crossing"]
research_action = "Record live edge, physical regions, carried origin, origin owner, path owner, and order before selection; find a graph-contiguous repeated cycle and compare a matched quiet reference before proposing suppression."

[[lesson]]
id = "LP-047"
kind = "learner-physics"
statement = "Outward effect delivery and path genesis are distinct physical operations: suppressing new paths only on the firing caused across a region boundary preserves the effect, external and same-region learning, replay, and quiescence while removing the hand's runaway re-entry."
evidence = ["hand-boundary-effect-reentry-v1:effect-born-genesis-isolation", "hand-boundary-effect-reentry-v1:external-surface-discriminator", "hand-boundary-effect-reentry-v1:conditional-reflected-hand"]
applies_when = ["motor effect", "cross-region delivery", "path genesis", "feedback re-entry", "natural quiescence"]
research_action = "Carry a transient boundary-effect fact from actual incidence to structural genesis; do not treat an entire region as terminal, and measure complete capability separately from the repaired safety transition."

[[lesson]]
id = "LP-048"
kind = "learner-physics"
statement = "A consequence-born timing fact must govern consequence admission as well as later closure: at the clamped hand boundary, pre-opening repeated surfaces were correctly ineligible for closure but still wrote a fresh consequence every step, permanently suppressing an executable alternative."
evidence = ["hand-upper-boundary-release-localization-v1:upper-boundary-opposite-candidate-localization", "hand-upper-boundary-release-localization-v1:pre-boundary-matched-control", "hand-upper-boundary-release-localization-v1:complete-localization"]
applies_when = ["consequence renewal", "output competition", "boundary release", "repeated physical context", "return eligibility"]
research_action = "Apply the existing birth-after-opening predicate before consequence write and return answering, preserve genuinely later returns, then test the existing no-consequence replacement path before adding ranking or memory."

[[lesson]]
id = "LP-049"
kind = "learner-physics"
statement = "The observed failure was that a genuinely later unchanged sample and a movement-caused return carried the same origin and both passed birth-after-opening admission. The solve was to classify external incidence as sample or physical transition, carry the transition tick through causal lineage, and admit consequence only when that transition occurred after the return opened; the same three anonymous origins were then admitted on transition and seventy-six unchanged samples were rejected without hidden position, direction, or hand knowledge."
evidence = ["hand-consequence-born-return-admission-v1:consequence-born-return-admission", "hand-consequence-born-return-admission-v1:conditional-reflected-hand-release", "hand-physical-change-resampling-v1:physical-transition-return"]
applies_when = ["consequence renewal", "physical resampling", "state change", "temporal eligibility", "causal lineage"]
research_action = "Carry the physical transition from the external incidence boundary through actual causal participation; never infer change from a later timestamp, stable origin identity, or reconstructed world history."

[[lesson]]
id = "LP-050"
kind = "learner-physics"
statement = "The observed failure was that strict return-owner equality rejected a physically local organism-owned donor and root-learner-owned balanced recipient. The solve was to classify actual learner ancestry and admit only OrganismToRoot; one exact transfer then fired the silent motor and released upper contact without arbitrary cross-owner admission."
evidence = ["hand-bounded-fresh-opportunity-v1:complete-composition", "hand-opportunity-owner-boundary-v1:organism-to-root-hand-boundary", "hand-organism-root-fresh-opportunity-v1:conditional-reflected-hand-release"]
applies_when = ["fresh opportunity", "organism boundary", "root learner", "ownership mismatch"]
research_action = "Classify actual ancestry before relaxing owner equality; admit only a typed boundary that survives unrelated, sibling, lifetime, replay, and quiescence controls."

[[lesson]]
id = "LP-051"
kind = "learner-physics"
statement = "The observed result was that one safe fresh alternative produced both directions and upper escape but still did not reach the lower limit. The solve was to preserve the complete post-release trajectory and descend to the first lost physical continuation instead of treating one boundary release as closed-loop control."
evidence = ["hand-organism-root-fresh-opportunity-v1:conditional-reflected-hand-release", "hand-organism-root-fresh-opportunity-v1:complete-composition", "hand-post-release-continuation-localization-v1:first-continuation-failure"]
applies_when = ["boundary release", "cumulative travel", "one-joint control", "first-failure descent"]
research_action = "Keep release and complete control as separate claims; after release, compare the last continuing step with the first stalled or reversed step using the whole-decision trace."

[[lesson]]
id = "LP-052"
kind = "learner-physics"
statement = "The observed first post-release stall retained complete paths, executable owner-local candidates, consequence reads, and both outputs, but opposing effects canceled within one external cycle. The attempted solve was unique owner-local physical-transition continuation; it reduced opposing cycles from six to four while leaving nine real changes and no lower contact, proving pre-write continuation alone insufficient."
evidence = ["hand-post-release-continuation-localization-v1:first-continuation-failure", "hand-physical-transition-continuation-v1:physical-transition-continuation", "hand-physical-transition-continuation-v1:complete-composition"]
applies_when = ["opposing output coactivation", "physical continuation", "complete candidates", "cumulative control"]
research_action = "Do not add more path, memory, or executability at this wall; discriminate the remaining competition timing and effect-composition cases while preserving sample release and exact return lifetime."

[[lesson]]
id = "LP-053"
kind = "learner-physics"
statement = "The observed mismatch was that outputs from separate naturally quiescent Harness runs were combined into one batched force update, erasing the first phase's world effect before the next input was sampled. The counterfactual solve was explicit sequential composition at the adapter boundary; actual transitions rose from nine to twenty-one while replay, quiescence, and learner blindness held, but this cannot replace the official batched Academy force law."
evidence = ["hand-effect-composition-laws-v1:sequential-world-composition", "hand-effect-composition-laws-v1:frozen-batched-parent"]
applies_when = ["effect composition", "external adapter", "quiescent phase", "world resampling", "Academy control"]
research_action = "Make composition order explicit and preserve the official adapter as an exact control; use counterfactual adapter evidence to localize physics, never to claim the official capability."

[[lesson]]
id = "LP-054"
kind = "learner-physics"
statement = "The observed result was that recent unresolved-effect coherence improved the official batched hand from nine to eleven actual transitions and reduced opposing-output steps from six to four, while its composition with sequential world updates produced twenty transitions and only three opposing steps but still no lower contact. The solve was to preserve ordered phase directions and both-boundary predicates, which showed nineteen positive versus eight negative effects and localized the remaining wall to sustained sign coherence rather than missing motion."
evidence = ["hand-effect-composition-laws-v1:coherent-unresolved-effect", "hand-effect-composition-laws-v1:combined-composition", "hand-effect-composition-laws-v1:frozen-batched-parent"]
applies_when = ["unresolved effect", "cumulative travel", "opposing output", "directional coherence", "boundary control"]
research_action = "Distinguish activity from cumulative travel; next localize whether answer, expiry, ambiguity, or descendant-owner turnover ends the same output-return transaction before it can carry one sign to the opposite boundary."

[[lesson]]
id = "LP-055"
