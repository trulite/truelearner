[[lesson]]
id = "RM-000A"
kind = "research-method"
statement = "The observed ambiguity was that an ownership change was named as a failure before establishing the categorical shape of local choice. The solve was to test the laws in order: first require each candidate view to admit one physical arrow, then test composition of completed arrows, then test whether representation changes preserve that arrow. This ruled out multi-target admission and localized the first non-commuting square to a missing completed-cycle witness."
evidence = ["hand-completed-cycle-composition-v1:completed-cycle-successor", "hand-completed-cycle-naturality-v1:choice-trace-inertness", "hand-completed-cycle-naturality-v1:completed-cycle-first-arrow-change"]
applies_when = ["composition claim", "ownership reconstruction", "naturality", "multi-target admission", "category-theory model"]
research_action = "State the objects and physical arrows, prove admission is functional, test adjacent composition, and only then test whether representation changes make the corresponding square commute."

[[lesson]]
id = "RM-000B"
kind = "research-method"
statement = "The observed mistake was that existing runtime trace already contained path participation, consequence writes, learner construction, ownership, candidate decisions, and return lifetime, while a reduced frozen artifact discarded the context needed for the next diagnosis. The solve is to audit and preserve the existing decisive trace slice before adding instrumentation; add an event only for a specifically named physical fact that is truly absent."
evidence = ["hand-completed-cycle-naturality-v1:choice-trace-inertness", "hand-completed-cycle-naturality-v1:completed-cycle-first-arrow-change"]
applies_when = ["diagnostic request", "existing physical trace", "reduced evidence artifact", "instrumentation proposal"]
research_action = "Inventory existing trace fields, map each diagnostic question to recorded evidence, and retain the full decisive before/after slice in immutable artifacts before proposing another event or run."

[[lesson]]
