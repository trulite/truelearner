schema = "research-protocol/v1"
id = "hand-lineage-construction-selectivity-v1"
program = "learner-physics"
claim = "DEVELOPMENTAL-HAND-LADDER"
status = "preregistered"
parent_authority = "hand-causal-lineage-preservation-v1 convergence"
question = "Do the causal-lineage hand's fourteen constructions represent repeated output-caused physical boundaries, or do temporal coactivity and repeated ownership of one unchanged boundary create false depth?"
observables = [
  "frozen closure and construction keys, run kinds, movement directions, and parent digest",
  "closure and construction counts under delayed consequence, same-run coactivity, disconnected activity, and duplicate lineage",
  "learner ancestry depth and distinct physical surface/output boundary keys under repetition",
  "two-surface discovery in both delivery orders, exact replay, and natural quiescence",
]
frozen_variables = [
  "causal-lineage and recursive learner physics",
  "frozen parent trace and its falsified same-first-closure classification",
  "construction threshold, return lifetime, locality, impulse, strength, and owner memory",
  "public Harness interface and external post-run evaluator",
]
permitted_changes = [
  "add a research-only trace classifier",
  "add anonymous public-Harness selectivity fixtures",
  "record a successor diagnostic campaign and convergence",
]
positive_predicates = [
  "chronological-first identity is rejected when the first observation is not post-movement output-caused consequence",
  "only two exact post-output delayed consequence observations construct",
  "same-run current-state coactivity, disconnected activity, and duplicate same-moment lineage do not construct",
  "repeating one unchanged surface/output boundary does not count as discovering a new physical boundary",
  "two distinct connected surfaces remain discoverable in either delivery order",
  "all evidence replays exactly and settles naturally",
]
negative_controls = [
  "immutable parent digest 85df69ff559a50317be4a6703a75db8e63af02a8eb15162a7c1237760f10f0dd",
  "disconnected matched activity and duplicate same-moment origin",
  "same-run pre-movement surface coactivity",
  "reversed distinct-surface delivery order and eight-round same-boundary horizon",
]
stop_conditions = [
  "the parent artifact changes or cannot be parsed",
  "replay or natural quiescence fails",
  "the diagnostic requires changing core physics or supplying semantic anatomy to the learner",
  "the earliest failed selectivity transition is recorded",
]

[run_policy]
max_valid_runs = 1
fresh_environment = true

