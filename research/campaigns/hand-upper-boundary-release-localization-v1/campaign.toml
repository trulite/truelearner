schema = "research-campaign/v1"
id = "hand-upper-boundary-release-localization-v1"
program = "learner-physics"
kind = "diagnostic"
mode = "discovery"
hypothesis = "The quiet hand's upper-boundary stall is an output-competition failure sustained by consequence renewal from returns whose physical origin began before the incumbent's new return opened."
first_divergence = "The hand is clamped at the upper boundary with two executable motor candidates but emits only the incumbent motor."
prediction = "One unchanged trace shows the silent motor survive path and threshold gates, lose local output selection, and remain suppressed because temporally ineligible repeated surfaces refresh the incumbent consequence."
falsifiers = [
  "The silent motor lacks a live executable path before selection.",
  "The incumbent does not receive refreshed consequence while clamped.",
  "The refreshed origins are consequence-born after their return opened.",
  "The diagnostic changes trajectory, replay, quiescence, or exhaustion.",
]
positive_reference = "hand-boundary-effect-reentry-v1 conditional-reflected-hand quiet upper-boundary trajectory"
negative_controls = [
  "last successful moving step",
  "both stable physical motor endpoints",
  "exact replay, natural quiescence, and zero propagation exhaustion",
]
included_mechanisms = [
  "existing drive provenance and exhaustive output-candidate evaluation",
  "existing causal-origin and local candidate-selection events",
  "existing return-origin, consequence-write, and consequence-born closure-eligibility events",
]
inherited_constraints = [
  "unchanged hand and learner behavior, no semantic direction or expected action",
  "bounded deterministic evidence and representative warm runtime below ten seconds",
]
excluded_proposals = [
  "new core diagnostic event, learner state, path lifetime, strength, ranking, return admission, or hand-world change",
  "default adoption, solve arm, reflected control, or benchmark-specific release",
]
arm_paths = [
  "arms/upper-boundary-opposite-candidate-localization.toml",
