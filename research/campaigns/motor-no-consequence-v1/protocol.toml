schema = "research-protocol/v1"
id = "learner-motor-no-consequence-v1"
program = "learner-physics"
claim = "ARC-NEXT"
status = "preregistered"
parent_authority = "86d471654497ac27af0a1beb9b52cada7d52bd7d"
question = "Can existing pending outcome-return topology expose an unused local motor route when a learned route fires again but produces no consequence?"
observables = [
  "ordered outward physical identities in a two-output fixture",
  "open local return paths before and after each opportunity",
  "links updated by a later outcome",
  "changed finger axes in Body Discovery",
  "exact replay, natural quiescence, physical work, and semantic-firewall controls",
]
frozen_variables = [
  "parent commit 86d471654497ac27af0a1beb9b52cada7d52bd7d",
  "path formation, strength, outcome propagation, body integration, proprioception, and motor readiness",
  "Academy worlds, capability order, evaluators, thresholds, seeds, and step budget",
  "far-output independence, reflection, delayed consequence, replay, and quiescence controls",
]
permitted_changes = [
  "local output competition may observe whether a candidate path already has an open physical return",
  "a composition arm may close a superseded open local return before a competing route participates",
]
positive_predicates = [
  "a learned route immediately reuses after its consequence returns",
  "after that reused route receives no consequence, the next local opportunity exposes the alternative",
  "a later outcome updates only routes still physically open for that consequence",
  "Body Discovery seed 31001 advances beyond DigitSeparation without evaluator or body changes",
]
negative_controls = [
  "a route awaiting a delayed outcome remains open when no competing local motor opportunity occurs",
  "far outputs remain independent",
  "reflection creates no fixed side preference",
  "Academy sends no action, direction, capability, score, or correctness field",
  "checkpoint replay remains exact and every run reaches natural quiescence",
]
stop_conditions = [
  "immediate consequence no longer causes learned reuse",
  "an alternative is selected without a physically open unanswered return",
  "a stale superseded route receives credit for the alternative's consequence",
  "the mechanism requires finger, axis, direction, capability, evaluator, or benchmark identity",
  "reference controls, replay, quiescence, or the warm work bound fail",
]

[run_policy]
max_valid_runs = 1
fresh_environment = true
