parent_authority = "sensorimotor-physical-boundaries-v1@68f6e6bfd2c1542a8052cdcb8bd6209308796eedaf3366f574401d5476c0e797"
question = "Do the three failed sensorimotor boundaries arise from discontinuity between actual participation, local return, consequence state, and later selection; and do repaired continuities close the one-joint and staged body fixtures without semantic control?"
observables = [
  "path existence, return existence, modulatory delivery, consequence write, later read, candidate admission, and output",
  "incumbent strength, recent-route continuation, no-consequence release, and eligibility expiry at ratios 1, 2, 4, and 8",
  "single-surface and two-surface updates and recall, duplicate and unrelated updates, reversed order, and stale return count",
  "per-member executable route, physical origin, consequence tick, admission, trained pair output, untrained fanout, and either-alone output",
  "finite-return, indexed-aging, and origin-sparsity predicates in one neutral composition",
  "both reflected joint limits and stage-gated binocular-hand, vocal-auditory, and full-body predicates",
  "exact replay, default-protocol equality, work, and natural quiescence",
]
frozen_variables = [
  "source revision 67ee08f2cc4b7bd05edc00a8574f484e36aa37d6 and parent evidence digest fcd2475019f33e455bcf4567a8e12bd90fa5caf504738f102f69975f4ed3d960",
  "default Physical, UnansweredReturnDeferral, and UnansweredReturnReplacement behavior",
  "parent classifications for finite return, active-frontier scaling, origin sparsity, recent eligibility, learned coalition, and surface return",
  "public Harness input/read/output boundary, exact checkpoint replay, and natural quiescence",
  "anonymous topology without action, route, coalition, surface, axis, direction, body-part, target, score, episode, answer, or evaluator identity",
]
permitted_changes = [
  "add Harness-visible observations and physical trace events for already existing local state transitions",
  "make recent consequence state follow the exact participating executable path into later candidate selection",
  "make a jointly consequential set arise from per-member participation lineage rather than a named coalition",
  "correct a research fixture that failed to form the action path required by its own return hypothesis",
  "add one explicitly selected experimental protocol only if a localized solve cannot remain within the existing candidate protocol",
  "add research-only Rust probes and immutable discovery artifacts",
]
positive_predicates = [
  "the parent classifications reproduce before successor interpretation",
  "every localized trace identifies the first divergence without private Body access",
  "recent consequence continues through ratio 8, preserves incumbent strength, expires, and releases without consequence",
  "one valid local surface opens and updates a finite return before any cohort claim",
  "two useful surfaces each associate once in either order while duplicate, unrelated, and stale credit remain absent",
  "a trained consequential pair emits both members while untrained shared fanout and either-alone controls emit one",
  "all three parent survivors retain their exact predicates under neutral composition",
  "dependent embodied stages run only after their measured prerequisites survive",
  "all executed arms replay exactly and quiesce naturally",
]
negative_controls = [
  "unchanged default protocols and parent reference classifications",
  "no-consequence release, historical-strength preservation, and eligibility expiry",
  "no-path surface fixture, duplicate surface, unrelated surface, reverse order, and post-window return count",
  "untrained shared-origin fanout, independent-origin fanout, and either-member-alone",
  "delay-200 stale consequence and 1024 dormant stable outputs",
]
stop_conditions = [
  "any fixture calls Body or private learner state",
  "a solve requires semantic identity, reconstructed history, evaluator knowledge, or evaluator-selected active structure",
  "a frozen parent or default observation changes",
  "a dependent composition is called successful after an actual prerequisite fails",
  "replay differs, activity requires evaluator termination, or a negative result is repaired in place",
  "discovery survival is presented as unique necessity or adopted authority",
]

[run_policy]
max_valid_runs = 1
fresh_environment = true
