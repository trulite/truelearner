  "external-incidence birth time carried with actual causal lineage",
  "exact return-opening time and strict birth-after-opening closure eligibility",
  "post-moment retirement of the answered output's entire return cohort",
  "stable eligible-before-ineligible outcome ordering within one physical moment",
]
