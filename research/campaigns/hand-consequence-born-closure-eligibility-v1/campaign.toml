hypothesis = "A closure is earned only by an actual incidence born after its participating output opened the return; sibling returns share that output's answer lifetime, and eligible returns must be evaluated before newly opened ineligible competitors."
first_divergence = "The causal-lineage learner admits a pre-output surface through a still-live sibling return from the preceding output, or lets a new ineligible return consume the origin before the older eligible return."
missing_transition = "Local consequence-born ordering across incidence birth, exact return opening, output-cohort lifetime, and same-moment return evaluation."
prediction = "Both partial compositions retain distinct counterexamples; the full three-part composition rejects coactivity and equality, constructs after two delayed consequences, preserves one effect and old controls, then exposes boundary novelty as the next independent frontier."
falsifiers = [
  "The full composition admits pre-output coactivity or loses either delayed consequence.",
  "Temporal-only or temporal-plus-cohort no longer reproduce their frozen counterexamples.",
  "Duplicate, disconnected, stale, simultaneous-surface, reversed-order, replay, quiescence, or immutable-parent controls fail.",
  "The mechanism uses evaluator semantics or changes old protocols.",
]
positive_reference = "hand-lineage-construction-selectivity-v1 preserved causal lineage plus two exact output-caused delayed observations"
negative_controls = [
  "immutable parent convergence and exact digest",
  "temporal-only sibling-return reuse and cohort-only ineligible-first suppression",
  "pre-output coactivity, equality, duplicate, disconnected, stale, reversed-order, and one-effect controls",
]
