schema = "research-protocol/v1"
id = "hand-consequence-born-closure-eligibility-v1"
program = "learner-physics"
claim = "DEVELOPMENTAL-HAND-LADDER"
status = "preregistered"
parent_authority = "hand-lineage-construction-selectivity-v1 convergence sha256:9d1eb1461931fa6159e3955d39edd814e43531f266c2be66c184b2f0df2a8915"
question = "Does strict consequence-born incidence timing, output-cohort retirement, and eligible-return-first ordering jointly reject pre-output coactivity while preserving valid delayed consequence, causal participation, one effect, replay, and natural quiescence?"
observables = [
  "closure and construction counts for delayed, pre-output coactive, equality, disconnected, duplicate, stale, and simultaneous-surface cases",
  "origin birth tick and exact return-opening tick for every closure eligibility decision",
  "return cohort source, opening tick, and retired-link count",
  "learner depth and distinct physical surface/output keys after the temporal gate",
  "exact checkpoint replay, order reversal, immutable parent digest, and natural quiescence",
]
frozen_variables = [
  "causal-lineage membership, per-origin admission, reverse consolidation, construction threshold, owner memory, and return lifetime",
  "junction topology, impulses, strengths, competition, action/output timing, and public Harness boundary",
  "immutable parent convergence and both falsified partial candidate variants",
  "evaluator isolation: no action, surface, movement, hand, or answer label enters learner physics",
]
permitted_changes = [
  "carry external-incidence birth ticks inside existing causal lineage",
  "record local return-opening ticks and expose diagnostic eligibility and cohort events",
  "add isolated temporal-only, temporal-plus-cohort, and complete eligible-priority protocols",
  "stable-partition one moment's outcome firings by local consequence-born eligibility",
  "retire all sibling returns opened by the answered physical output cohort after the moment",
  "run boundary novelty only after the complete temporal gate survives",
]
positive_predicates = [
  "two delayed action-then-surface rounds produce two closures and one construction",
  "pre-output coactivity and equality at return opening produce no closure",
  "the complete composition preserves one effect under two simultaneous useful surfaces and is stable under reversed input order",
  "old partial variants retain their exact counterexamples",
  "duplicate, disconnected, stale, replay, quiescence, and immutable-parent controls pass",
]
negative_controls = [
  "temporal-only sibling-return reuse and temporal-plus-cohort ineligible-first suppression",
  "same-tick equality, repeated pre-output coactivity, duplicate origin, disconnected surface, and stale post-cohort delivery",
  "two simultaneous surfaces in both input orders and twelve same-boundary repetitions",
  "immutable parent digest 9d1eb1461931fa6159e3955d39edd814e43531f266c2be66c184b2f0df2a8915",
]
stop_conditions = [
  "any ineligible return wins over an eligible return or a valid delayed consequence is lost",
  "any pre-output, equality, disconnected, duplicate, or stale control constructs",
  "physical strengthening is multiplied, same-class order changes, replay diverges, or a run fails to quiesce",
  "boundary novelty is attempted before the complete temporal gate survives",
  "the hand ladder is resumed if boundary novelty remains falsified",
]

[run_policy]
max_valid_runs = 1
fresh_environment = true
