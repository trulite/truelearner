schema = "research-protocol/v1"
id = "workstation-monitor-cue-reuse-v1"
program = "learner-physics"
claim = "WORKSTATION-KEY-SELECTION-LADDER"
status = "preregistered"
parent_authority = "Connected Outcome Product V1 at 7be8bbc3009fe3131622a6ee21e9aa260d649aa1; development inputs pinned in plans/workstation-monitor-cue-reuse.md"
question = "After ordinary exploration makes two proper physical keys produce visible monitor glyphs, do paired later monitor glyphs from one identical checkpoint reuse different learner paths and produce different executable outward effects?"
observables = ["proper key-down text-change and key-up events", "monitor raster retinal learner-only candidate choice movement contact and device-event projections", "consequence record and consumption diagnostics after the self-caused screen change", "paired cue blank and unlearned runs from one checkpoint", "exact replay natural quiescence physical work and semantic-firewall evidence"]
frozen_variables = ["full standard ANSI 104-key scene with proper labels collision key hysteresis and visible hand", "accepted connected-outcome product shared opportunity and first-choice outcome lifetime", "wide signed retinotopy threshold factorization movement-caused visual return and one-cause palm fanout", "seed development horizon probe horizon and initial body state", "evaluator ownership of glyph source key IDs stage verdict and first-failure classification"]
permitted_changes = ["optional replayable external monitor glyph rendered only into binocular pixels", "external presentation update that changes no learner body state sequence or physical time", "lossless paired projection and first-failure classifier over already emitted observations"]
positive_predicates = ["ordinary development produces and releases at least two proper printable keys", "each key-caused monitor change reaches raster retina learner and a retained consequence path", "paired learned cues start from equal learner body and device state and differ first in pixels", "the two cues diverge in learner path executable choice and outward body effect", "blank and unlearned controls do not fabricate the same learned two-way relation", "all runs replay exactly quiesce naturally stay bounded and preserve the semantic firewall"]
negative_controls = ["absent monitor cue as exact default identity", "same cue replay from the same checkpoint", "blank cue", "unlearned printable glyph", "unchanged cue resampling", "existing real-key press release reference", "existing stable-fixation reference", "serialized organism-sample firewall"]
stop_conditions = ["the complete candidate does not produce and release two proper printable key outcomes", "the key-caused monitor raster change is not sampled by the retina", "no exact participating action-outcome return is retained", "paired monitor cue pixels do not differ", "paired cue pixels differ but retina learner candidate choice or body effect does not", "presentation changes learner or body state sequence or physical time before a step", "replay quiet work reference or firewall controls fail"]

[run_policy]
max_valid_runs = 1
fresh_environment = true
