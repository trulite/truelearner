schema = "research-protocol/v1"
id = "hand-causal-origin-ownership-factorization-v1"
program = "learner-physics"
claim = "DEVELOPMENTAL-HAND-LADDER"
status = "preregistered"
parent_authority = "hand-owner-local-candidate-factorization-v1 convergence sha256:5526db51da57410a695f8756ff1b616130aa80f4c08bba7b397017f3795b03f2"
question = "Can causal-origin-first factorization transfer, preserve private ownership, and improve the unchanged hand without producing self-sustaining activity?"
observables = [
  "origin groups, executable groups, selected origin, selected ownership, output count, input-order behavior, replay, and quiescence in the unrelated fixture",
  "same-origin mixed-owner output count and whether origin factorization activates",
  "hand changed steps, final position, closure, perturbation, exact replay, natural quiescence, first propagation exhaustion, and motor candidate count",
]
frozen_variables = [
  "all boundary, temporal, causal-lineage, private-memory, path-lifetime, and hand-world behavior",
  "ordinary exact-owned and organism candidate evaluation, output interpretation, and evaluator isolation",
]
permitted_changes = [
  "add one opt-in protocol that partitions a mixed incidence by carried physical origin before resolving each factor's ownership",
  "select a unique independently executable origin group using existing consequence, drive, and participation evidence",
  "add observation-only origin-resolution and propagation-budget diagnostics",
  "use bounded send only to preserve and measure a natural-quiescence failure that otherwise does not return",
]
positive_predicates = [
  "the unrelated two-origin fixture produces exactly one effect while its boundary reference remains rejected",
  "input reversal preserves behavior and exact replay preserves canonical state",
  "the same-origin mixed-owner control produces no effect",
  "the unchanged hand improves beyond three changed steps and every send quiesces naturally",
]
negative_controls = [
  "same-origin mixed-owner incidence, unresolved tie, ambiguous origin group, exact-owned identity, organism identity, and one-effect law",
  "matched boundary reference, old regressions, replay, natural quiescence, and warm runtime",
]
stop_conditions = [
  "the same-origin control produces an effect or origin labels launder private evidence",
  "any hand send exhausts the diagnostic propagation budget or the hand does not close and recover",
  "the fixture produces zero or multiple effects, becomes order-dependent, or any inherited control regresses",
]

[run_policy]
max_valid_runs = 1
fresh_environment = true
