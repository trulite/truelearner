schema = "research-protocol/v1"
id = "hand-origin-feedback-cycle-localization-v1"
program = "learner-physics"
claim = "DEVELOPMENTAL-HAND-LADDER"
status = "preregistered"
parent_authority = "hand-causal-origin-ownership-factorization-v1 convergence sha256:b31ad8a0a2a52caf98eea474d8d87ae61d6346620d9c11914ee34ae983e2eb6b"
question = "Which exact physical edges repeat before the step-eight propagation exhaustion, and where do carried-origin and traversed-path ownership disagree?"
observables = [
  "ordered drive edge, physical endpoints, regions, carried origin, origin owner, path owner, strength, path completion, tick, and causal wave",
  "first exhaustion step, repeated edge count, graph continuity and closure, outward crossings, inward reentries, and minimum traversal count",
  "candidate and matched-reference movement, final position, exhaustion count, replay, and natural quiescence",
]
frozen_variables = [
  "all hand inputs, topology, candidate selection, origin propagation, path formation, learning, execution, and output interpretation",
  "the causal-origin candidate, 256-moment diagnostic bound, matched boundary reference, and frozen expected behaviors",
]
permitted_changes = [
  "add one trace-only event emitted for each valid scheduled drive firing before selection",
  "record live link and learner provenance without persisting it in organism state",
  "fold the finite trace into owner disagreements and a generic repeated directed cycle",
  "serialize compact diagnostic evidence and no behavior change",
]
positive_predicates = [
  "at least one completing input has a known path owner and unowned carried origin",
  "the first exhausted step contains a graph-contiguous closed cycle with at least three traversals of every edge",
  "the cycle includes at least one outward crossing and one inward reentry",
  "the candidate retains eight changed steps, final position four, two exhaustions, exact replay, and non-quiescence",
  "the matched boundary reference retains three changed steps, final position minus one, zero exhaustions, exact replay, natural quiescence, and no repeated cycle",
]
negative_controls = [
  "external inputs have absent source, link, and path owner",
  "physical tracing remains observational and diagnostic events do not alter work or state",
  "cycle detection uses graph continuity and recurrence rather than motor identity or expected movement",
]
stop_conditions = [
  "the trace changes frozen candidate or reference behavior",
  "no repeated closed cycle is found before exhaustion",
  "the reference also contains a repeated cycle or exhausts",
  "replay, evidence determinism, or warm runtime regresses",
]

[run_policy]
max_valid_runs = 1
fresh_environment = true
