  "The candidate passes isolation but changes no sensorimotor frontier in the full ladder.",
  "The mechanism requires body-part, action, capability, target, score, or evaluator identity.",
  "The frozen global reference, exact replay, reference equality, or natural quiescence changes.",
]
positive_reference = "277fa3141a5d028f738984c0ccede76e615ad88e: the global-return organism acquires gaze contingency, gaze control, and hand contingency; BinocularDepth and DigitSeparation remain independent first frontiers with exact replay."
