schema = "research-protocol/v1"
id = "sensorimotor-locality-v1"
program = "learner-physics"
claim = "SENSORIMOTOR-LOCALITY"
status = "preregistered"
parent_authority = "277fa3141a5d028f738984c0ccede76e615ad88e"
question = "Does returning each physical consequence only along paths opened by outputs that caused that local change make reusable sensorimotor control emerge in one undivided learner across unrelated bodies?"
observables = [
  "ordered anonymous output crossings and the local physical variables each crossing actually changes",
  "return source and path opened by each participating output",
  "exact links strengthened by each returned consequence",
  "later autonomous reuse, reversal at limits, isolated-axis movement, and cross-axis coactivation",
  "visual change under gaze and vergence, including fresh binocular disparity bands",
  "delayed acoustic change at two ears after nonlinguistic vocal airflow, amplitude, pitch, and tract motion",
  "physical work, topology growth, replay equality, reference equality, and natural quiescence",
]
frozen_variables = [
  "parent commit 277fa3141a5d028f738984c0ccede76e615ad88e",
  "input, junction, link, path, output, strength, path formation, choice, participation, consolidation, timing, decay, and body integration laws",
  "anonymous physical inputs and outputs; no action, axis, digit, eye, ear, voice, target, capability, score, or evaluator identity enters the learner",
  "the current global-return reference, accepted core boundary controls, corrected digit-separation oracle, and binocular-depth oracle",
  "development, fresh probe, transfer, replay, quiescence, and bounded-work evidence rules",
]
permitted_changes = [
  "an organism may contain several anonymous physical outcome sources instead of only one",
  "actual output participation may open its temporary return path from the outcome source physically wired to that output",
  "an experimental world may return a consequence only through sources whose paired outputs caused an observed local physical change",
  "the research-only sensorimotor ladder may add neutral joint, raster, touch, acoustic, and vocal physical surfaces outside the production dependency graph",
]
positive_predicates = [
  "in a two-output fixture where both outputs participate and only one causes change, only the causal path strengthens; reflection swaps the result exactly",
  "blocked, cancelled, passive, disconnected, unrelated, and shuffled-return controls never credit a noncausal path",
  "a single anonymous joint develops consequential motion in both directions and later leaves either physical limit without injected action selection",
  "a repeated-axis body produces isolated control on at least two distinct axes without global coactivation receiving shared credit",
  "the unchanged binocular course records repeated vergence consequences in both eyes on a fresh disparity band",
  "a nonlinguistic vocal body develops independent consequential variation on at least two vocal axes and receives the delayed result through both ears",
  "a held-out multimodal composition reuses acquired local control without semantic commands or evaluator return",
  "all accepted controls retain exact replay, reference equality, natural quiescence, and bounded unexplained cost",
]
negative_controls = [
  "one global outcome source reproduces the frozen parent behavior",
  "the same number of outcome sources with shuffled physical wiring does not satisfy causal isolation",
  "passive sensor change opens no motor credit",
  "an output blocked at a limit receives no consequence from another moving axis",
  "equal opposing outputs that cancel receive no movement consequence",
  "a disconnected actuator and sensor form no credited causal relation",
  "external sound acoustically identical to self-produced sound does not credit a silent vocal path",
  "left-right reflection, ear swap, fresh textures, fresh disparity, changed acoustic delay, and changed body scale preserve the declared physical laws",
]
stop_conditions = [
  "the tiny fixture cannot identify exact participating and strengthened paths",
  "a noncausal, blocked, cancelled, passive, disconnected, or shuffled path strengthens",
  "the global reference no longer reproduces the parent physical history",
  "the candidate requires semantic identity, reconstructed probable history, evaluator feedback, or a specialist learner",
  "replay, reference equality, natural quiescence, or accepted boundary controls fail",
  "a stage exceeds its declared physical-work, memory, or runtime budget without a causal explanation",
]

[run_policy]
max_valid_runs = 1
fresh_environment = true
