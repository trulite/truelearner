schema = "research-protocol/v1"
id = "hand-physical-transition-continuation-v1"
program = "learner-physics"
claim = "DEVELOPMENTAL-HAND-LADDER"
status = "preregistered"
parent_authority = "hand-post-release-continuation-localization-v1 convergence"
question = "Can a unique current owner-local transition retain its unanswered incumbent through pre-write competition and close the unchanged joint?"
observables = ["continuation admission, transition lineage, owner, unanswered return, competing candidates", "both limits, escapes, perturbation, replay, quiescence, propagation"]
frozen_variables = ["root fresh opportunity parent", "unchanged reflected hand"]
permitted_changes = ["one opt-in transient continuation predicate"]
positive_predicates = ["current-transition incumbent is uniquely admitted", "opposing coactivation decreases", "complete hand control"]
negative_controls = ["sample", "answered/stale/mismatched/ambiguous transition", "root-fresh parent", "old protocols", "reflection and replay"]
stop_conditions = ["sample admits continuation", "coactivation persists", "boundary release is lost", "integrity fails"]

[run_policy]
max_valid_runs = 1
fresh_environment = true
