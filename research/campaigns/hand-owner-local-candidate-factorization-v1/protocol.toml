schema = "research-protocol/v1"
id = "hand-owner-local-candidate-factorization-v1"
program = "learner-physics"
claim = "DEVELOPMENTAL-HAND-LADDER"
status = "preregistered"
parent_authority = "hand-autonomous-reuse-localization-v1 convergence sha256:1ae83ef6d8b98e5045cf5e634b73c2c3a69065411c83b36c85081a70f41a8c9c"
question = "Can strict owner-only factorization turn a mixed output incidence into one private executable candidate, transfer outside the hand, and improve the unchanged reflected hand without cross-owner credit?"
observables = [
  "owner groups, executable groups, selected owner, selected path input count, outputs, replay, and quiescence in an unrelated mixed-owner fixture",
  "hand changed steps, final position, primary closure, perturbation recovery, and per-candidate distinct physical-origin and known-owner counts",
]
frozen_variables = [
  "all boundary, temporal, causal-lineage, private-memory, path lifetime, and hand-world behavior",
  "ordinary exact-owned and organism candidate evaluation, output interpretation, and evaluator isolation",
]
permitted_changes = [
  "add one opt-in protocol that partitions a mixed incidence only when every completing path has a learner owner",
  "select a unique independently executable owner group using existing consequence, drive, and participation evidence",
  "add observation-only owner-resolution and distinct-origin/owner diagnostics",
]
positive_predicates = [
  "the unrelated two-owner fixture produces exactly one effect while its reference remains rejected",
  "input reversal preserves behavior and exact replay preserves canonical state",
  "the unchanged hand improves beyond the three-step boundary reference",
]
negative_controls = [
  "unowned path input, subthreshold owner group, unresolved tie, exact-owned identity, organism identity, and one-effect law",
  "matched boundary reference, old regressions, replay, quiescence, and warm runtime",
]
stop_conditions = [
  "the fixture produces zero or multiple effects, cross-owner use, or order-dependent behavior",
  "the hand does not improve after the fixture survives",
  "an unowned path is silently absorbed into an owner group or any inherited control regresses",
]

[run_policy]
max_valid_runs = 1
fresh_environment = true
