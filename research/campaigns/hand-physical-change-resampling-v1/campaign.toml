schema = "research-campaign/v1"
id = "hand-physical-change-resampling-v1"
program = "learner-physics"
kind = "solve"
mode = "discovery"
hypothesis = "A physically carried anonymous transition fact can preserve real movement consequence while making unchanged later sampling unable to renew the incumbent, allowing existing bounded replacement to release the hand."
first_divergence = "A later unchanged sample and a movement-contingent physical return have the same origin and arrival shape, so birth timing admits both."
missing_transition = "Actual external transition must remain distinct from ordinary sampling through causal lineage and govern consequence admission."
prediction = "Matched origins separate locally; aliased stable-member novelty fails; transition-gated consequence preserves controls and exposes the silent motor if existing replacement is sufficient."
falsifiers = [
  "A later sample writes consequence or a later transition is lost.",
  "The distinction uses semantic or evaluator-only hand state inside the learner.",
  "The discriminator survives locally but the silent motor remains non-executable or the hand remains clamped.",
]
positive_reference = "hand-consequence-born-return-admission-v1 consequence-born-return-admission"
negative_controls = ["parent upper-clamped hand", "same-origin later sample", "aliased active-surface set", "old protocol equality", "exact replay and natural quiescence"]
included_mechanisms = ["boundary-effect terminality", "causal lineage birth", "consequence-born admission", "physical incidence classification", "transition lineage", "unanswered-return replacement"]
inherited_constraints = ["unchanged drive physics", "no learner position, direction, contact, limit, hand, desired action, or evaluator state", "no new learner memory or ranking", "warm runtime below ten seconds"]
excluded_proposals = ["timestamp-only change inference", "stable-member novelty as universal motion", "position delta inside learner", "strength reset", "hand-specific reversal", "default adoption"]
arm_paths = [
