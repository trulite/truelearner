schema = "research-protocol/v1"
id = "hand-physical-change-resampling-v1"
program = "learner-physics"
claim = "DEVELOPMENTAL-HAND-LADDER"
status = "preregistered"
parent_authority = "hand-consequence-born-return-admission-v1 convergence sha256:8e7a19e7e53d1a5e8a33d670b5ea5a61cceb8ef763419dca51f7d56f26289b65"
question = "Can an anonymous physical transition carried by actual causal lineage distinguish movement-contingent consequence from later unchanged sampling, and does that distinction safely release the reflected hand?"
observables = [
  "external sample and transition incidence, transition tick, causal lineage, live return opening, typed admission decision, consequence write, and closure",
  "stable active-origin sets across actual movement, matched transitioned and sampled origins, and unchanged resampling",
  "both motor candidate drives, thresholds, ownership, executability, consequence recency, selection, output, upper escape, travel, replay, quiescence, and work",
]
frozen_variables = [
  "the reflected hand's positions, active surfaces, motor integration, reflection, contact, capacities, step bounds, and existing movement-contingent pending return",
  "the parent candidate's four actual position changes, one motor, upper clamp, exact replay, natural quiescence, and zero propagation exhaustion",
]
permitted_changes = [
  "classify external physical incidence generically as sample or transition while preserving identical drive behavior",
  "carry an optional transition tick per anonymous causal origin and expose it through core diagnostics",
  "add one opt-in protocol requiring transition after exact return opening before consequence admission and closure",
  "mark the hand's already movement-contingent pending return as transition and ordinary active-surface polling as sample",
]
positive_predicates = [
  "the same anonymous origin is admitted when transitioned and rejected when merely sampled, with no rejected consequence write",
  "old protocols preserve behavior, transition lineage survives checkpoint replay, and the candidate remains naturally quiescent",
  "if the existing release path is sufficient, the hand exposes and executes the silent motor and leaves the upper boundary",
]
negative_controls = [
  "birth timing alone remains insufficient and stable active-member novelty is falsified by aliased interior movement",
  "no position, direction, contact, limit, desired motion, hand identity, or evaluator-selected action enters the learner",
  "the parent protocol, ordinary sampling, causal propagation, replay, and propagation bounds remain unchanged",
]
stop_conditions = [
  "sample and transition do not separate at consequence admission or change ordinary firing",
  "transition lineage is reconstructed rather than physically carried, or semantic world state crosses into the learner",
  "the hand remains clamped, the silent motor is non-executable, feedback exhaustion returns, or quiescence/replay fails",
]

[run_policy]
max_valid_runs = 1
fresh_environment = true

