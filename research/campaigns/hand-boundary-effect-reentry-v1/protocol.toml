schema = "research-protocol/v1"
id = "hand-boundary-effect-reentry-v1"
program = "learner-physics"
claim = "DEVELOPMENTAL-HAND-LADDER"
status = "preregistered"
parent_authority = "hand-origin-feedback-cycle-localization-v1 convergence sha256:103bbb83226fa9914300e59bc1d6ddaf9684f926da612ff85383549f4de7abe7"
question = "Can a local boundary between effect delivery and path genesis remove the closed feedback cycle without suppressing legitimate external and same-region learning?"
observables = [
  "first effect output count, effect-born junction proposal, replay, and quiescence in an unrelated two-effect fixture",
  "path formation from an externally fired outward surface and an internal same-region surface under both candidate laws",
  "hand physical position changes, reached boundary, direction count, final position, exhaustion, replay, quiescence, closure, and perturbation recovery",
]
frozen_variables = [
  "all origin, ownership, selection, consequence, strength, lifetime, effect execution, hand inputs, and world behavior",
  "the 256-moment diagnostic bound, capacities, causal-origin reference, and frozen diagnostic result",
]
permitted_changes = [
  "add two opt-in protocols inheriting the complete causal-origin candidate",
  "carry a transient bit showing that a fired incidence arrived through a cross-region link",
  "under boundary-effect terminality, suppress only new path formation from that exact firing",
  "under regional closure, compare source and output regions during new path formation",
]
positive_predicates = [
  "the reference emits its first effect and forms an effect-born cross-region path; both candidates preserve the first effect and reject that proposal",
  "boundary-effect terminality preserves external outward-surface formation while regional closure rejects it",
  "both candidates preserve internal same-region formation and quiescence",
  "the selected law removes both hand exhaustions, replays exactly, quiesces naturally, and reaches the upper physical boundary",
]
negative_controls = [
  "cross-region delivery itself remains unchanged",
  "external input is not classified as a boundary effect",
  "the complete hand predicate still requires two directions, both boundaries, release, perturbation recovery, replay, and quiescence",
]
stop_conditions = [
  "the first effect changes or the unrelated proposal remains",
  "external or same-region formation regresses under the narrow law",
  "the hand still exhausts or fails replay",
  "the partial hand transition is reclassified as complete capability",
]

[run_policy]
max_valid_runs = 1
fresh_environment = true
