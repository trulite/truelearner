schema = "research-campaign/v1"
id = "hand-autonomous-reuse-localization-v1"
program = "learner-physics"
kind = "diagnostic"
mode = "discovery"
hypothesis = "The post-construction hand stall can be localized without changing behavior by observing retained owned paths and every motor candidate before executability filtering."
first_divergence = "A terminal surface consequence consolidates reverse paths and writes owner memory, but the next ordinary surface activity produces no motor output."
prediction = "One unchanged run orders path lifetime, traversal, motor-candidate formation, ownership, executability, and private consequence lookup, and the temporal reference yields the same diagnosis."
falsifiers = [
  "The diagnostic changes behavior, state, work, replay, or quiescence.",
  "Retained path, traversal, ownership, and consequence lookup cannot be ordered.",
  "The matched temporal and boundary protocols disagree on behavior or first failure.",
]
positive_reference = "hand-physical-boundary-member-novelty-v1 complete boundary composition and frozen three-of-sixteen hand counterexample"
negative_controls = [
  "trace-on versus trace-off equality",
  "eligible-return temporal hand reference",
  "organism, exact-owned, ambiguous, and non-executable candidate states",
]
included_mechanisms = [
  "observation-only surface path-state event",
  "observation-only output-candidate evaluation event",
  "compact per-step transition classifier",
]
inherited_constraints = [
  "unchanged hand, learner physics, ownership, lifetime, selection, and evaluator isolation",
  "exact replay, natural quiescence, and representative warm runtime below ten seconds",
]
excluded_proposals = [
  "path retention, candidate partitioning, owner reentry, ranking changes, lifetime changes, or any other solve",
  "anatomy, direction, desired pose, learner depth, benchmark stage, or evaluator identity",
]
arm_paths = [
  "arms/boundary-candidate-localization.toml",
  "arms/temporal-matched-control.toml",
  "arms/complete-localization.toml",
]
max_parallel_arms = 3
max_rounds = 1
interaction_expected = true

[budget]
total_sandbox_minutes = 30
max_minutes_per_arm = 10

[preflight]
tiny_fixture = true
hidden_authority_audit = true
reference_replay_equality = true
natural_quiescence = true

[convergence]
after_each_round = true
survivor_fraction = 0.5

[authority]
fresh_sandbox = true
max_valid_runs = 1
requires_frozen_protocol = true

