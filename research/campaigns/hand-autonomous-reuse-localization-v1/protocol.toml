schema = "research-protocol/v1"
id = "hand-autonomous-reuse-localization-v1"
program = "learner-physics"
claim = "DEVELOPMENTAL-HAND-LADDER"
status = "preregistered"
parent_authority = "hand-physical-boundary-member-novelty-v1 convergence sha256:336c750d033a7b01c417b09bf1dc28f9557215e5665e852095d9b3145d780f03"
question = "At the first post-construction hand stall, is autonomous reuse first lost at retained reverse-path lifetime, traversal into a motor candidate, exact owner resolution, or owner-local consequence lookup?"
observables = [
  "per-step owned surface firing with retained complete and consequential path counts",
  "per-step motor candidate path input, admitted drive, projected drive, threshold, ownership, consequence tick, and executability",
  "last physical movement, terminal consequence step, first post-stall step, exact replay, natural quiescence, and matched temporal behavior",
]
frozen_variables = [
  "boundary-member candidate and eligible-return temporal reference physics",
  "hand topology, inputs, step schedule, surface delivery, limits, motor interpretation, and success oracle",
  "path formation, lifetime, propagation, ownership, candidate evaluation, selection, output, learning, and work accounting",
]
permitted_changes = [
  "add observation-only surface path-state and output-candidate diagnostic events",
  "aggregate the new events in the neutral hand protocol adapter",
  "classify the first absent transition from one unchanged run per frozen protocol",
]
positive_predicates = [
  "trace-on and trace-off executions preserve outputs, state, work, execution cost, replay, and quiescence",
  "the diagnostic orders retained path, traversal, ownership, candidate executability, and consequence lookup",
  "the boundary candidate and temporal reference retain identical physical behavior and the same first missing transition",
]
negative_controls = [
  "unowned organism candidate, exact owned candidate, ambiguous candidate, and subthreshold candidate remain distinguishable",
  "the earlier terminal consequence, reverse consolidation, owner write, and three-of-sixteen movement trajectory remain unchanged",
]
stop_conditions = [
  "diagnostics alter outputs, persistent state, work, replay, quiescence, or hand behavior",
  "the event chain cannot distinguish retained path, traversal, ownership, and private consequence lookup",
  "the matched temporal and boundary runs disagree on behavior or first missing transition",
]

[run_policy]
max_valid_runs = 1
fresh_environment = true
