schema = "research-protocol/v1"
id = "workstation-binocular-alignment-v1"
program = "learner-physics"
claim = "BOUNDED-BINOCULAR-ALIGNMENT-DEVELOPMENT"
status = "preregistered"
parent_authority = "accepted connected outcome product and shared workstation opportunity at dfe933886d4a030d7775356f78e908e8531c2fc2; retained inherited failure dd7daf1cd81d799668b5a6d99861370c9ed93b3b98ec1e4dd1e2b6b37d5709bf"
question = "Do two independent retinotopic eye loops, each carrying only its own movement-caused visual return, compose into bounded binocular alignment across generated disparity bands without a fused depth signal or vergence command?"
observables = ["per-eye target error before and after each actual horizontal movement", "signed retinal threshold transitions and physical output origin", "left and right movement direction and timing", "minimum and final total alignment error", "gaze separation ordering across disparity bands", "exact replay natural quiescence work checkpoints and serialized-input firewall"]
frozen_variables = ["authoritative learner protocol", "shared generic opportunity incidence", "two independent eye axes and ordinary body force law", "fixed twelve-receptor capacity per eye", "external evaluator ownership of target disparity error and verdict", "production WorkstationHarness default"]
permitted_changes = ["research-only orthogonal visual-composition profile", "research-only symmetric horizontal retinal lattice", "external alignment evidence and retained trace", "honest Academy binocular predicate"]
positive_predicates = ["each eye reduces its own target error through actual horizontal movement", "the two-eye product reduces total alignment error on near middle and far bands", "larger target disparity yields a larger achieved opposing gaze relation", "the complete trace replays exactly naturally quiesces remains bounded and contains no semantic input", "production traces and Harness tests remain exact"]
negative_controls = ["collapsed retinal placement", "no movement-caused visual return", "no threshold factorization", "zero disparity", "uniform light", "unchanged-body resampling", "one-eye or same-direction motion cannot establish the product"]
stop_conditions = ["the complete candidate fails a cheap signed-response or firewall gate", "either eye needs the other eye's sample target coordinate disparity verdict or desired direction", "a removal preserves the same full result without explanation", "production replay checkpoint quiet work or trace identity regresses"]

[run_policy]
max_valid_runs = 1
fresh_environment = true
