schema = "research-protocol/v1"
id = "hand-consequence-born-return-admission-v1"
program = "learner-physics"
claim = "DEVELOPMENTAL-HAND-LADDER"
status = "preregistered"
parent_authority = "hand-upper-boundary-release-localization-v1 convergence sha256:8e7a19e7e53d1a5e8a33d670b5ea5a61cceb8ef763419dca51f7d56f26289b65"
question = "Does enforcing the existing birth-after-opening predicate before consequence admission preserve valid returns and allow the unchanged hand's existing no-consequence release path to expose the suppressed motor?"
observables = [
  "typed pre-opening rejection, later local/direct admission, consequence writes, and unanswered return behavior",
  "upper reach and escape, both physical motor outputs, both movement signs, lower travel, position changes, and final position",
  "propagation exhaustion, exact replay, natural quiescence, primary closure, perturbation recovery, and warm runtime",
]
frozen_variables = [
  "the unchanged reflected hand, boundary-effect terminality, causal lineage, return timing, path formation, candidate ranking, output integration, capacities, and 256-moment bound",
  "the parent reference's four actual position changes, upper clamp, one physical motor, zero exhaustion, replay, and quiescence",
]
permitted_changes = [
  "add one opt-in protocol that applies strict birth-after-opening eligibility before return-origin admission",
  "emit a typed pre-opening rejection and leave the rejected return unanswered",
  "reuse all existing consequence, consolidation, closure, candidate competition, and boundary-effect behavior",
]
positive_predicates = [
  "pre-opening origins cannot answer or write while genuinely later local and direct returns remain valid",
  "the incumbent releases to one previously suppressed executable physical alternative",
  "the unchanged hand reaches and leaves the upper boundary, emits both physical motors, and does not exhaust propagation",
  "exact replay and natural quiescence hold",
]
negative_controls = [
  "the boundary-effect-terminal parent remains unchanged",
  "missing, inactive, wrong-mode, duplicate, unrelated, and stale return decisions remain typed",
  "no semantic hand, direction, contact, position, desired movement, or evaluator identity enters the learner",
]
stop_conditions = [
  "a pre-opening return still writes consequence or a later valid return is lost",
  "the tiny release fixture or hand does not expose the alternative",
  "feedback exhaustion or non-quiescence returns",
  "replay, old protocols, or warm runtime regress",
]

[run_policy]
max_valid_runs = 1
fresh_environment = true

