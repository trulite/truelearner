schema = "research-e2b-batch/v1"
id = "<batch-id>"
mode = "discovery"
max_parallel = 4
output_directory = "<batch output directory>"

[[arm]]
id = "<arm-id>"
cwd = "<clean source checkout>"
command = ["<E2B runner>", "<runner arguments>"]
protocol_sha256 = "<protocol digest>"
result_path = "<neutral result JSON produced by the arm command>"
timeout_seconds = 3600
