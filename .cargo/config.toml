[build]
rustc-wrapper = ".cargo/rustc-cache-wrapper.sh"

# sccache cannot cache rustc incremental artifacts. Split crates into many
# codegen units instead so cold/reproducible development builds remain
# parallel while their reusable library outputs stay cacheable.
[profile.dev]
incremental = false
codegen-units = 256
debug = 1

[profile.test]
incremental = false
codegen-units = 256
debug = 1
