[workspace]
members = [
    "crates/academy-arc3",
    "crates/academy-body",
    "crates/academy-formal",
    "crates/academy-workstation2",
    "crates/academy-workstation2-course",
]
default-members = [
    "crates/academy-arc3",
    "crates/academy-body",
    "crates/academy-formal",
    "crates/academy-workstation2",
    "crates/academy-workstation2-course",
]
resolver = "2"

[profile.test]
opt-level = 2

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
academy-arc3 = { path = "crates/academy-arc3" }
academy-body = { path = "crates/academy-body" }
academy-formal = { path = "crates/academy-formal" }
academy-workstation2 = { path = "crates/academy-workstation2" }
academy-workstation2-course = { path = "crates/academy-workstation2-course" }
truelearner-workstation = { path = "../truelearner/crates/workstation" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
