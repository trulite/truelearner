[workspace]
members = ["crates/academy-core", "crates/playground"]
default-members = ["crates/academy-core", "crates/playground"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
academy-core = { path = "crates/academy-core" }
truelearner-core = { path = "../truelearner/crates/core" }
truelearner-arena-format = { path = "../truelearner/crates/arena-format" }
base64 = "0.22.1"
dioxus = { version = "0.7.10", default-features = false }
futures-timer = "3.0.3"
font8x8 = "0.3.1"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
