[workspace]
members = [
    "crates/academy-core",
    "crates/academy-storage",
    "crates/playground",
]
default-members = [
    "crates/academy-core",
    "crates/academy-storage",
    "crates/playground",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
academy-core = { path = "crates/academy-core" }
academy-storage = { path = "crates/academy-storage" }
truelearner-core = { path = "../truelearner/crates/core" }
truelearner-arena-format = { path = "../truelearner/crates/arena-format" }
aws-config = { version = "1.8.10", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1.115.0", default-features = false, features = ["rt-tokio", "rustls"] }
base64 = "0.22.1"
dioxus = { version = "0.7.10", default-features = false }
futures-timer = "3.0.3"
font8x8 = "0.3.1"
hex = "0.4.3"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
