[workspace]
members = [
    "crates/academy-body",
    "crates/academy-workstation",
    "crates/academy-workstation-review",
]
default-members = [
    "crates/academy-body",
    "crates/academy-workstation",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
academy-body = { path = "crates/academy-body" }
academy-workstation = { path = "crates/academy-workstation" }
academy-workstation-review = { path = "crates/academy-workstation-review" }
truelearner-workstation = { path = "../truelearner/crates/workstation" }
font8x8 = "0.3.1"
flate2 = "1"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
