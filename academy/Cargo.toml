[workspace]
members = [
    "crates/academy-core",
    "crates/academy-body",
    "crates/academy-workstation",
    "crates/academy-arc3",
    "crates/academy-review",
    "crates/academy-episodes",
    "crates/academy-runner",
    "crates/playground",
]
default-members = [
    "crates/academy-core",
    "crates/academy-body",
    "crates/academy-workstation",
    "crates/academy-arc3",
    "crates/academy-review",
    "crates/academy-episodes",
    "crates/academy-runner",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
academy-core = { path = "crates/academy-core" }
academy-body = { path = "crates/academy-body" }
academy-workstation = { path = "crates/academy-workstation" }
academy-arc3 = { path = "crates/academy-arc3" }
academy-review = { path = "crates/academy-review" }
academy-episodes = { path = "crates/academy-episodes" }
truelearner-core = { path = "../truelearner/crates/core" }
truelearner-workstation = { path = "../truelearner/crates/workstation" }
dioxus = { version = "0.7.10", default-features = false }
futures-timer = "3.0.3"
font8x8 = "0.3.1"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
percent-encoding = "2.3.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
