[workspace]
members = [
    "crates/academy-arc3",
    "crates/academy-body",
    "crates/academy-formal",
    "crates/academy-workstation",
    "crates/academy-workstation-course",
    "crates/academy-workstation-review",
]
default-members = [
    "crates/academy-arc3",
    "crates/academy-body",
    "crates/academy-workstation",
    "crates/academy-workstation-course",
]
resolver = "2"

[profile.test]
opt-level = 2

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
academy-body = { path = "crates/academy-body" }
academy-arc3 = { path = "crates/academy-arc3" }
academy-formal = { path = "crates/academy-formal" }
academy-workstation = { path = "crates/academy-workstation" }
academy-workstation-course = { path = "crates/academy-workstation-course" }
academy-workstation-review = { path = "crates/academy-workstation-review" }
truelearner-workstation = { path = "../truelearner/crates/workstation" }
font8x8 = "0.3.1"
flate2 = "1"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
